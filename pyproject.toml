[project]
name = "embarch-atlas"
version = "0.1.0"
description = "Hardware documents (schematics, datasheets, reference manuals, PRD) joined to Zephyr firmware, for LLM agents"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
mcp = ["mcp>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
embarch-atlas = "embarch_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embarch_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
