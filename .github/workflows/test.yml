name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: poppler (pdftotext, pdfinfo, pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install
        run: pip install -e '.[dev,tokens,mcp]'
      - name: pytest
        run: pytest -q
